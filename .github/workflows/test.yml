name: Tests
run-name: Execute all tests using Mocha and update coverage badges

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write
  statuses: write
  actions: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "lts/*"
      - name: Setup pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 10
      - name: Install dependencies
        run: pnpm install --frozen-lockfile # Install from frozen lockfile
      - name: Run tests
        run: pnpm test
